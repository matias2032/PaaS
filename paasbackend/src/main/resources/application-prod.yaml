# application-prod.yaml
spring:
  application:
    name: paasbackend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: paas_platform
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    schemas: paas_platform
    default-schema: paas_platform
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24h in ms

app:
  registration:
    require-email-verification: true
  encryption:
    key: ${ENCRYPTION_KEY}

